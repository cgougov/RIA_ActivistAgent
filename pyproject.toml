[project]
name = "fund"
version = "1.0.0"
description = "Japan activist funds research platform - terminal-first"
requires-python = ">=3.10"
dependencies = ["openai>=1.50", "PyMuPDF>=1.24", "python-dotenv>=1.0"]

[project.scripts]
fund = "fund.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fund"]
